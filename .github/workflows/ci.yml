name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

permissions:
  contents: write

# Every commit on master keeps its run; a pull request only needs its newest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Master collects the PHP and JS coverage and publishes it to GitHub Pages.
      COVERAGE: ${{ github.ref == 'refs/heads/master' || github.head_ref == 'ci-pcov-coverage' }}

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: test
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -h localhost -u root -proot" --health-interval=10s --health-timeout=5s --health-retries=3

      selenium-firefox:
        image: selenium/standalone-firefox:latest
        env:
          TZ: Europe/Prague
        ports:
          - 4444:4444
        volumes:
          - ".:/mnt/ddev_config"
        options: >-
          --add-host=host.docker.internal:host-gateway

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for git-restore-mtime to access full history

      - name: Restore file modification times
        uses: chetan/git-restore-mtime-action@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          # PCOV records only src/ and costs far less than Xdebug; without coverage no driver slows the requests down.
          coverage: ${{ env.COVERAGE == 'true' && 'pcov' || 'none' }}
          # Without opcache's optimizer, as under Xdebug: it merges and drops lines (a run of echos, a jump), and they would drop out of the coverage.
          ini-values: pcov.directory=${{ github.workspace }}/src, opcache.optimization_level=0

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Test build and deploy scripts
        run: pnpm run test:scripts

      - name: Build React app
        run: ${{ env.COVERAGE == 'true' && 'pnpm run build:coverage' || 'pnpm run build' }}

      - name: Generate WebP images
        timeout-minutes: 10
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/w" -w /w \
            minidocks/imagemagick:latest@sha256:9f4bc19b65901db910d249c2c097a3ec37a56ae7df41df9fb1b04b99789822ff \
            sh scripts/convert-to-webp.sh

      - name: Commit generated WebP files
        uses: stefanzweifel/git-auto-commit-action@v7
        if: github.ref == 'refs/heads/master'
        with:
          commit_message: "chore: auto-generate WebP images"
          file_pattern: "webroot/img/*.webp webroot/img/**/*.webp"
          skip_checkout: true

      - name: Setup tmp directories
        run: |
          mkdir -p tmp/cache/models tmp/cache/persistent tmp/cache/views tmp/logs tmp/sessions tmp/tests
          chmod -R 777 tmp

      - name: Setup database config
        run: |
          cat > config/database.php << 'EOF'
          <?php
          class DATABASE_CONFIG {
              public $default = [
                  'datasource' => 'Database/Mysql',
                  'persistent' => false,
                  'host' => '127.0.0.1',
                  'login' => 'root',
                  'password' => 'root',
                  'database' => 'test',
                  'prefix' => '',
                  'encoding' => 'utf8mb4',
              ];

              public function __construct() {
                  if (Configure::read('debug') > 0) {
                      $this->default['log'] = true;
                  }
              }

              public $test = [
                  'datasource' => 'Database/Mysql',
                  'persistent' => false,
                  'host' => '127.0.0.1',
                  'login' => 'root',
                  'password' => 'root',
                  'database' => 'test',
                  'prefix' => '',
                  'encoding' => 'utf8mb4',
              ];
          }
          EOF
          cp .github/ci/core.local.php config/core.local.php

      - name: Import database schema
        run: |
          ./vendor/bin/phinx migrate -e test

      - name: Start built-in PHP server
        env:
          TZ: UTC
        run: |
          mkdir -p /tmp/coverage
          # Use router script to handle CakePHP dispatcher filter routes
          if [ "$COVERAGE" = "true" ]; then
            nohup php -d auto_prepend_file="$PWD/.github/ci/coverage-prepend.php" -S 0.0.0.0:8080 -t webroot .github/ci/router.php > server.log 2>&1 &
          else
            nohup php -S 0.0.0.0:8080 -t webroot .github/ci/router.php > server.log 2>&1 &
          fi
          sleep 3

      - name: Start Caddy HTTPS reverse proxy
        run: |
          nohup docker run --rm \
            -p 8443:8443 \
            --add-host=host.docker.internal:host-gateway \
            --sysctl net.ipv6.conf.all.disable_ipv6=1 \
            --sysctl net.ipv6.conf.default.disable_ipv6=1 \
            -v "${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile" \
            caddy:2 > caddy.log 2>&1 &
          sleep 6
          echo "Caddy log:"
          cat caddy.log || true

      - name: Run tests
        env:
          TZ: UTC
          SELENIUM_URL: http://localhost:4444
          SELENIUM_BROWSER: firefox
          TEST_APP_URL: https://host.docker.internal:8443
          TEST_ENVIRONMENT: github-ci
        run: |
          mkdir -p /tmp/coverage
          # phpunit, with the tests the browser alone failed run again (scripts/phpunit-retry.php)
          php scripts/phpunit-retry.php --exclude-group apache-only --exclude-group disabled ${{ env.COVERAGE == 'true' && '--coverage-php /tmp/coverage/phpunit.cov' || '' }}

      - name: Upload browser timeout dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-timeout-dumps
          path: tmp/browser-timeout-*.html
          if-no-files-found: ignore

      # PHPUnit's phpunit.cov and one webserver-*.cov per request of the Selenium tests (.github/ci/coverage-prepend.php)
      - name: Merge coverage files
        if: env.COVERAGE == 'true'
        run: vendor/bin/phpcov merge --html coverage/php --clover coverage/coverage.xml /tmp/coverage

      - name: Upload coverage report (measurement only)
        if: env.COVERAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pcov
          path: coverage/coverage.xml

      - name: Generate JS coverage report
        if: env.COVERAGE == 'true'
        run: pnpm run coverage:js

      - name: Restore coverage history
        if: github.ref == 'refs/heads/master'
        run: |
          git fetch --depth=1 origin gh-pages || true
          mkdir -p coverage
          if git cat-file -e origin/gh-pages:coverage/coverage-history.json 2>/dev/null; then
            git show origin/gh-pages:coverage/coverage-history.json > coverage/coverage-history.json
          else
            echo '[]' > coverage/coverage-history.json
          fi

      - name: Generate combined coverage index
        if: github.ref == 'refs/heads/master'
        run: pnpm run coverage:index

      - name: Deploy coverage to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage
          destination_dir: coverage

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --prefer-dist --optimize-autoloader --no-interaction

      - name: Run PHPStan
        run: composer stan -- --error-format=github

      - name: Run PHPCS
        run: composer cs-check -- --diff
