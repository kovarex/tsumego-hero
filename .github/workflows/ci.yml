name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

permissions:
  contents: write

# Every commit on master keeps its run; a pull request only needs its newest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # The whole history, for the image times below, but no file contents beyond the checked out commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # The WebP step converts an image whose .webp is older, so each image gets the time of the last commit that changed it.
      - name: Restore image modification times
        run: |
          git -c core.quotePath=false log --no-renames --format='@%ct' --name-only -- webroot/img \
            | awk '/^@/ {time = substr($0, 2); next} NF && !seen[$0]++ {print time " " $0}' \
            | while read -r time file; do
                if [ -e "$file" ]; then touch -m -d "@$time" "$file"; fi
              done

      # MariaDB, Selenium and Caddy pull and start while the job installs PHP and the packages and builds;
      # the steps that need them wait for them (as service containers they held up the job for 30 s).
      - name: Start the containers in the background
        run: |
          nohup docker run --rm --name mysql \
            -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=test \
            -p 3306:3306 \
            mariadb:10.11 > /tmp/mysql.log 2>&1 &
          # Firefox 158.0, geckodriver 0.37.1. Pinned, so a new Firefox or Selenium arrives in its own pull request instead of in any run
          nohup docker run --rm --name selenium-firefox \
            -e TZ=Europe/Prague \
            -p 4444:4444 \
            -v "$PWD:/mnt/ddev_config" \
            --add-host=host.docker.internal:host-gateway \
            selenium/standalone-firefox:4.51.0-20261010@sha256:2bb7d9e63088ba6dc7f4d5acd807f27d8410221f881853a97ac3c95f50e8d951 > /tmp/selenium.log 2>&1 &
          nohup docker pull -q caddy:2 > /dev/null 2>&1 &

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          # Only master collects coverage; elsewhere a loaded Xdebug would just slow every request down.
          coverage: ${{ github.ref == 'refs/heads/master' && 'xdebug' || 'none' }}

      - name: Configure Xdebug for coverage
        if: github.ref == 'refs/heads/master'
        run: |
            echo "zend_extension=$(php -i | grep -i xdebug | grep extension_dir | awk '{print $3}')/xdebug.so" >> $GITHUB_ENV
            echo "xdebug.mode=coverage" | sudo tee -a /etc/php/8.4/cli/conf.d/99-xdebug.ini
            echo "xdebug.start_with_request=yes" | sudo tee -a /etc/php/8.4/cli/conf.d/99-xdebug.ini
            php -v
            php -m | grep xdebug || (echo "Xdebug not found!" && exit 1)

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Test build and deploy scripts
        run: pnpm run test:scripts

      - name: Build React app
        run: ${{ github.ref == 'refs/heads/master' && 'pnpm run build:coverage' || 'pnpm run build' }}

      - name: Generate WebP images
        timeout-minutes: 10
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/w" -w /w \
            minidocks/imagemagick:latest@sha256:9f4bc19b65901db910d249c2c097a3ec37a56ae7df41df9fb1b04b99789822ff \
            sh scripts/convert-to-webp.sh

      - name: Commit generated WebP files
        uses: stefanzweifel/git-auto-commit-action@v7
        if: github.ref == 'refs/heads/master'
        with:
          commit_message: "chore: auto-generate WebP images"
          file_pattern: "webroot/img/*.webp webroot/img/**/*.webp"
          skip_checkout: true

      - name: Setup tmp directories
        run: |
          mkdir -p tmp/cache/models tmp/cache/persistent tmp/cache/views tmp/logs tmp/sessions tmp/tests
          chmod -R 777 tmp

      - name: Setup database config
        run: |
          cat > config/database.php << 'EOF'
          <?php
          class DATABASE_CONFIG {
              public $default = [
                  'datasource' => 'Database/Mysql',
                  'persistent' => false,
                  'host' => '127.0.0.1',
                  'login' => 'root',
                  'password' => 'root',
                  'database' => 'test',
                  'prefix' => '',
                  'encoding' => 'utf8mb4',
              ];

              public function __construct() {
                  if (Configure::read('debug') > 0) {
                      $this->default['log'] = true;
                  }
              }

              public $test = [
                  'datasource' => 'Database/Mysql',
                  'persistent' => false,
                  'host' => '127.0.0.1',
                  'login' => 'root',
                  'password' => 'root',
                  'database' => 'test',
                  'prefix' => '',
                  'encoding' => 'utf8mb4',
              ];
          }
          EOF
          cp .github/ci/core.local.php config/core.local.php

      - name: Import database schema
        run: |
          # Over TCP, which the temporary server of MariaDB's first start doesn't listen on.
          timeout 120 sh -c 'until docker exec mysql mariadb --protocol=tcp -h 127.0.0.1 -uroot -proot -e "SELECT 1" test > /dev/null 2>&1; do sleep 0.5; done' || (cat /tmp/mysql.log; exit 1)
          ./vendor/bin/phinx migrate -e test

      # The database lives as long as the job, so a commit doesn't need to reach the disk; each test makes dozens
      - name: Let the database skip flushing each commit
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL innodb_flush_log_at_trx_commit = 0; SELECT @@innodb_flush_log_at_trx_commit"

      - name: Start built-in PHP server
        env:
          TZ: UTC
        run: |
          mkdir -p /tmp/coverage
          # Use router script to handle CakePHP dispatcher filter routes
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            nohup php -d xdebug.mode=coverage -d xdebug.start_with_request=yes -d auto_prepend_file=/home/runner/work/tsumego-hero/tsumego-hero/.github/ci/xdebug-prepend.php -S 0.0.0.0:8080 -t webroot .github/ci/router.php > server.log 2>&1 &
          else
            nohup php -S 0.0.0.0:8080 -t webroot .github/ci/router.php > server.log 2>&1 &
          fi
          # Ready once it serves a static file (no app request, so no coverage of its own); a server that never does fails the step with its log.
          timeout 30 sh -c 'until curl -s -o /dev/null http://127.0.0.1:8080/robots.txt; do sleep 0.2; done' || (cat server.log; exit 1)

      - name: Start Caddy HTTPS reverse proxy
        run: |
          nohup docker run --rm \
            -p 8443:8443 \
            --add-host=host.docker.internal:host-gateway \
            --sysctl net.ipv6.conf.all.disable_ipv6=1 \
            --sysctl net.ipv6.conf.default.disable_ipv6=1 \
            -v "${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile" \
            -v "${{ github.workspace }}/webroot:/srv:ro" \
            caddy:2 > caddy.log 2>&1 &
          # Ready once it answers through to the PHP server (the image pull is part of the wait).
          timeout 60 sh -c 'until curl -sk -o /dev/null https://localhost:8443/robots.txt; do sleep 0.2; done' || (cat caddy.log; exit 1)
          echo "Caddy log:"
          cat caddy.log

      - name: Wait for Selenium
        run: |
          timeout 120 sh -c 'until curl -s http://localhost:4444/status | grep -q "\"ready\": *true"; do sleep 0.5; done' || (cat /tmp/selenium.log; exit 1)

      - name: Run tests
        env:
          TZ: UTC
          SELENIUM_URL: http://localhost:4444
          SELENIUM_BROWSER: firefox
          TEST_APP_URL: https://host.docker.internal:8443
          TEST_ENVIRONMENT: github-ci
        run: |
          mkdir -p /tmp/coverage
          # phpunit, with the tests the browser alone failed run again (scripts/phpunit-retry.php)
          php scripts/phpunit-retry.php --exclude-group apache-only --exclude-group disabled ${{ github.ref == 'refs/heads/master' && '--coverage-php /tmp/coverage/phpunit.cov' || '' }}

      - name: Upload browser failure dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-dumps
          path: |
            tmp/browser-timeout-*.html
            tmp/browser-failure-*
          if-no-files-found: ignore

      # PHPUnit's phpunit.cov and one webserver-*.cov per request of the Selenium tests (.github/ci/xdebug-prepend.php)
      - name: Merge coverage files
        if: github.ref == 'refs/heads/master'
        run: vendor/bin/phpcov merge --html coverage/php --clover coverage/coverage.xml /tmp/coverage

      - name: Generate JS coverage report
        if: github.ref == 'refs/heads/master'
        run: pnpm run coverage:js

      - name: Restore coverage history
        if: github.ref == 'refs/heads/master'
        run: |
          git fetch --depth=1 origin gh-pages || true
          mkdir -p coverage
          if git cat-file -e origin/gh-pages:coverage/coverage-history.json 2>/dev/null; then
            git show origin/gh-pages:coverage/coverage-history.json > coverage/coverage-history.json
          else
            echo '[]' > coverage/coverage-history.json
          fi

      - name: Generate combined coverage index
        if: github.ref == 'refs/heads/master'
        run: pnpm run coverage:index

      - name: Deploy coverage to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage
          destination_dir: coverage

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --prefer-dist --optimize-autoloader --no-interaction

      - name: Run PHPStan
        run: composer stan -- --error-format=github

      - name: Run PHPCS
        run: composer cs-check -- --diff
