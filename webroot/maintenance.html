<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page every request gets while a deploy runs (deploy.sh, webroot/.htaccess): plain HTML with
     everything inline, as the rest of the site may be half updated. It asks again every 30 seconds,
     so it goes back to the site by itself once the deploy is done. -->
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex">
<title>Upgrade in progress · Tsumego Hero</title>
<style>
	/* The colours of the site (webroot/css/tokens.css): the dark gradient around a light panel, or a
	   dark one for a dark preference */
	:root
	{
		color-scheme: light dark;
		--body-background: linear-gradient(#282828, #424141);
		--panel-background: linear-gradient(#fff, #f2f2f2);
		--text-color: #222;
		--text-softer-color: #666;
		--accent-color: #6cc644;
	}
	@media (prefers-color-scheme: dark)
	{
		:root
		{
			--body-background: linear-gradient(#2a2a2a, #111);
			--panel-background: linear-gradient(#3c3c3c, #2a2a2a);
			--text-color: #ddd;
			--text-softer-color: #aaa;
		}
	}
	html
	{
		min-height: 100%;
		background: var(--body-background);
	}
	body
	{
		margin: 0;
		min-height: 100vh;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 28px;
		padding: 24px;
		box-sizing: border-box;
		font-family: "Times New Roman", Times, serif;
		color: var(--text-color);
	}
	.logo
	{
		width: min(347px, 80vw);
		height: auto;
		/* the logo has a dark background of its own */
		border-radius: 8px;
	}
	main
	{
		max-width: 460px;
		padding: 28px 36px;
		border-radius: 10px;
		background: var(--panel-background);
		box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
		text-align: center;
	}
	h1
	{
		margin: 0 0 12px;
		font-size: 28px;
	}
	p
	{
		margin: 0;
		font-size: 18px;
		line-height: 1.5;
	}
	.again
	{
		margin-top: 16px;
		font-size: 15px;
		color: var(--text-softer-color);
	}
	/* A phone shows it from the top: centred in a tall screen it left a big gap above it */
	@media (max-width: 600px)
	{
		body
		{
			justify-content: flex-start;
			gap: 20px;
			padding: 16px;
		}
		main
		{
			padding: 22px 20px;
		}
	}
	/* Three stones, lit one after another, while it waits */
	.stones
	{
		display: flex;
		justify-content: center;
		gap: 10px;
		margin: 18px 0 0;
	}
	.stones span
	{
		width: 14px;
		height: 14px;
		border-radius: 50%;
		background: var(--accent-color);
		opacity: 0.25;
		animation: light 1.5s infinite;
	}
	.stones span:nth-child(2) { animation-delay: 0.5s; }
	.stones span:nth-child(3) { animation-delay: 1s; }
	@keyframes light
	{
		0%, 100% { opacity: 0.25; }
		30% { opacity: 1; }
	}
	@media (prefers-reduced-motion: reduce)
	{
		.stones span { animation: none; opacity: 0.6; }
	}
</style>
</head>
