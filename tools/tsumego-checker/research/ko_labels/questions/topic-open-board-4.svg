<svg xmlns="http://www.w3.org/2000/svg" class="board" width="164" height="320" viewBox="0 0 164 320" role="img" aria-label="11320, Black to live, from the tree&#x27;s leaf c052, marked S[KO-2]: White has just retaken the ko at A18, and three Black stones are in atari at B17. Black 9 retakes after a threat elsewhere. White 10 forces Black 11, and White 12 retakes without a threat. Black 13 needs another threat, and White 14 and Black 15 repeat the exchange before White 16 retakes. If Black connects the ko instead of answering, White kills."><style>
