; The limits the site serves pages with, so a page too heavy, a file too large to
; upload or a form with too many fields fails here as it fails there.
; max_execution_time is 60 because the site's own /home/conf/php.ini lowers the 180
; of the server's php.ini; /home/conf/php.ini is read after it and wins.
memory_limit = -1
max_execution_time = 60
post_max_size = 10M
upload_max_filesize = 10M
max_input_vars = 1000
